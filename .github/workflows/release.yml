name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-image:
    name: Build and publish GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    outputs:
      image: ${{ env.IMAGE_NAME }}
      image-digest: ${{ steps.build.outputs.digest }}
      deployed-sha: ${{ steps.meta.outputs.sha }}
      image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

    steps:
      - name: Resolve source commit
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.title=Kaiyn Trading Bot

  deploy-production:
    name: Deploy production VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - build-image
    environment: production

    steps:
      - name: Prepare SSH credentials
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy image over SSH
        env:
          DEPLOY_IMAGE: ${{ needs.build-image.outputs.image-ref }}
          DEPLOY_SHA: ${{ needs.build-image.outputs.deployed-sha }}
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
        run: |
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${APP_DIR:?Missing PRODUCTION_APP_DIR}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/production_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' DEPLOY_IMAGE='$DEPLOY_IMAGE' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$APP_DIR"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Production worktree has uncommitted changes; aborting deploy."
            git status --short
            exit 1
          fi

          git fetch origin main
          git checkout main
          git merge --ff-only "$DEPLOY_SHA"

          if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
            echo "Production worktree did not resolve to expected commit $DEPLOY_SHA; aborting deploy."
            git rev-parse HEAD
            exit 1
          fi

          docker compose version
          BOT_IMAGE="$DEPLOY_IMAGE" make deploy-image
          docker compose ps
          docker compose logs --tail 80 bot
          REMOTE
