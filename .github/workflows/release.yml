name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-image:
    name: Build and publish GHCR image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    outputs:
      image: ${{ env.IMAGE_NAME }}
      image-digest: ${{ steps.build.outputs.digest }}
      deployed-sha: ${{ steps.meta.outputs.sha }}
      image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
      image-tag: ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}

    steps:
      - name: Resolve source commit
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.title=Kaiyn Trading Bot

  deploy-production:
    name: Deploy production via Coolify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - build-image
    environment: production

    steps:
      - name: Update Coolify image variable
        env:
          DEPLOY_IMAGE: ${{ needs.build-image.outputs.image-tag }}
          DEPLOY_SHA: ${{ needs.build-image.outputs.deployed-sha }}
          COOLIFY_API_BASE_URL: ${{ secrets.COOLIFY_API_BASE_URL }}
          COOLIFY_APPLICATION_UUID: ${{ secrets.COOLIFY_APPLICATION_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          : "${COOLIFY_API_BASE_URL:?Missing COOLIFY_API_BASE_URL}"
          : "${COOLIFY_APPLICATION_UUID:?Missing COOLIFY_APPLICATION_UUID}"
          : "${COOLIFY_TOKEN:?Missing COOLIFY_TOKEN}"
          : "${DEPLOY_IMAGE:?Missing DEPLOY_IMAGE}"

          API_BASE="${COOLIFY_API_BASE_URL%/}"
          python - <<'PY' > /tmp/coolify-bot-image.json
          import json
          import os

          print(json.dumps({
              "key": "BOT_IMAGE",
              "value": os.environ["DEPLOY_IMAGE"],
              "is_preview": False,
              "is_literal": True,
              "is_multiline": False,
              "is_shown_once": False,
          }))
          PY

          echo "Updating Coolify BOT_IMAGE for commit ${DEPLOY_SHA}"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "${API_BASE}/api/v1/applications/${COOLIFY_APPLICATION_UUID}/envs" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @/tmp/coolify-bot-image.json \
            --output /tmp/coolify-update-response.json

      - name: Trigger Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          : "${COOLIFY_WEBHOOK:?Missing COOLIFY_WEBHOOK}"
          : "${COOLIFY_TOKEN:?Missing COOLIFY_TOKEN}"

          echo "Triggering Coolify deployment"
          curl --fail-with-body --silent --show-error \
            --request GET \
            --url "${COOLIFY_WEBHOOK}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --output /tmp/coolify-deploy-response.json
