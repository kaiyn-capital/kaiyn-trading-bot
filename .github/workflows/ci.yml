name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-compose-checks:
    name: Docker Compose checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate production Compose configuration
        run: make compose-prod-check

      - name: Build test image
        run: docker compose build test

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Run Alembic migrations on clean database
        run: docker compose run --rm test alembic upgrade head

      - name: Check Alembic migration-model consistency
        run: docker compose run --rm test alembic check

      - name: Check uv lockfile
        run: docker compose run --rm test uv lock --check

      - name: Run Ruff lint
        run: docker compose run --rm test ruff check .

      - name: Check Ruff formatting
        run: docker compose run --rm test ruff format --check .

      - name: Run mypy type checking
        run: make mypy

      - name: Run pytest with PostgreSQL integration
        run: docker compose run --rm test python -m pytest --run-db --cov --cov-report=xml:coverage.xml

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@v1.11.2
        if: github.event_name == 'pull_request'
        with:
          pytest-xml-coverage-path: ./coverage.xml
          title: "Code Coverage Report"
          badge-title: "Coverage"

      - name: Compile Python files
        run: make py-compile

      - name: Check whitespace errors
        run: git diff --check

      - name: Downgrade Alembic migrations
        if: always()
        run: docker compose run --rm test alembic downgrade base || true

      - name: Clean up Docker Compose
        if: always()
        run: docker compose down -v --remove-orphans
