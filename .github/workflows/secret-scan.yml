name: Secret Scan

# Scans git history for committed secrets on every PR and push to main.
# Runs the gitleaks CLI via its Docker image (MIT-licensed, free for any
# account); the official gitleaks-action requires a paid license for
# organization-owned repositories, so it is intentionally not used here.
# The image is digest-pinned and refreshed weekly by digestabot.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose
