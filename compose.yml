x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-bot-image: &bot-image kaiyn-trading-bot-app
x-test-image: &test-image kaiyn-trading-bot-test

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaiyn_trading_bot}
      POSTGRES_USER: ${POSTGRES_USER:-kaiyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaiyn}
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

  bot:
    image: *bot-image
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kaiyn:kaiyn@postgres:5432/kaiyn_trading_bot}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups:ro
    command: ["python", "-m", "app.main"]
    logging: *default-logging

  test:
    image: *test-image
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    profiles:
      - test
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kaiyn}:${POSTGRES_PASSWORD:-kaiyn}@postgres:5432/${POSTGRES_DB:-kaiyn_trading_bot}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kaiyn}:${POSTGRES_PASSWORD:-kaiyn}@postgres:5432/${POSTGRES_DB:-kaiyn_trading_bot}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["python", "-m", "pytest"]
    logging: *default-logging

  maintenance:
    image: *bot-image
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kaiyn:kaiyn@postgres:5432/kaiyn_trading_bot}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command:
      - sh
      - -c
      - |
        while true; do
          date
          python -m app.main --cleanup-retention
          sleep "$${MAINTENANCE_INTERVAL_SECONDS:-86400}"
        done
    logging: *default-logging

  db-backup:
    image: *bot-image
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaiyn_trading_bot}
      POSTGRES_USER: ${POSTGRES_USER:-kaiyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaiyn}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_LOCAL_KEEP_COUNT: ${BACKUP_LOCAL_KEEP_COUNT:-3}
      R2_BACKUP_ENABLED: ${R2_BACKUP_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_PREFIX: ${R2_BACKUP_PREFIX:-kaiyn-trading-bot}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    command:
      - sh
      - /scripts/backup_loop.sh
    logging: *default-logging

volumes:
  postgres_data:
