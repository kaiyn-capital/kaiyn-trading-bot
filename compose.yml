services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaiyn_trading_bot}
      POSTGRES_USER: ${POSTGRES_USER:-kaiyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaiyn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://kaiyn:kaiyn@postgres:5432/kaiyn_trading_bot}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: ["python", "-m", "app.main"]

volumes:
  postgres_data:
