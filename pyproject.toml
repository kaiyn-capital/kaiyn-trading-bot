[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiyn-trading-bot"
version = "0.1.0"
description = "Telegram bot for Bitget futures signal execution"
readme = "readme.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-telegram-bot[ext]==20.6",
    "SQLAlchemy[asyncio]==2.0.23",
    "alembic==1.12.1",
    "asyncpg==0.29.0",
    "cryptography==41.0.7",
    "httpx==0.25.2",
    "python-dotenv==1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
