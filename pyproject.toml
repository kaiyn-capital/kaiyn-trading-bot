[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiyn-trading-bot"
version = "0.1.0"
description = "Telegram bot for Bitget futures signal execution"
readme = "readme.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-telegram-bot[ext]==22.7",
    "SQLAlchemy[asyncio]==2.0.49",
    "alembic==1.18.4",
    "asyncpg==0.29.0",
    "cryptography==48.0.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.12",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: opt-in PostgreSQL integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
