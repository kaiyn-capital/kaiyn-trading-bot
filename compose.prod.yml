services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production}
    ports: !override
      - "127.0.0.1:5432:5432"

  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to a GHCR image tag or digest}
    build: !reset null
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for production}

  maintenance:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to a GHCR image tag or digest}
    build: !reset null
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for production}

  db-backup:
    image: ${BOT_IMAGE:?Set BOT_IMAGE to a GHCR image tag or digest}
    build: !reset null
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for production}
