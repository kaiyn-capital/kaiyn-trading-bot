# Optional Coolify deployment variant.
# The production CD mainline uses GHCR + VPS SSH + compose.prod.yml.

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaiyn_trading_bot}
      POSTGRES_USER: ${POSTGRES_USER:-kaiyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

  migrate:
    image: ${BOT_IMAGE:?Set BOT_IMAGE in Coolify}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    logging: *default-logging

  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE in Coolify}
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in Coolify}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:?Set TELEGRAM_ADMIN_IDS in Coolify}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in Coolify}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      BITGET_API_URL: ${BITGET_API_URL:-https://api.bitget.com}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-86400}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      HEALTHCHECK_INTERVAL_SECONDS: ${HEALTHCHECK_INTERVAL_SECONDS:-300}
      ADMIN_ALERT_COOLDOWN_SECONDS: ${ADMIN_ALERT_COOLDOWN_SECONDS:-1800}
      ADMIN_NOTIFY_STARTUP_SUCCESS: ${ADMIN_NOTIFY_STARTUP_SUCCESS:-True}
      BITGET_ALERT_FAILURE_THRESHOLD: ${BITGET_ALERT_FAILURE_THRESHOLD:-3}
      BITGET_ALERT_WINDOW_SECONDS: ${BITGET_ALERT_WINDOW_SECONDS:-600}
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-36}
      MAINTENANCE_STALE_HOURS: ${MAINTENANCE_STALE_HOURS:-36}
      SIGNAL_CHART_ENABLED: ${SIGNAL_CHART_ENABLED:-true}
      SIGNAL_CHART_GRANULARITY: ${SIGNAL_CHART_GRANULARITY:-1H}
      SIGNAL_CHART_CANDLE_LIMIT: ${SIGNAL_CHART_CANDLE_LIMIT:-120}
      SIGNAL_CHART_TIMEOUT_SECONDS: ${SIGNAL_CHART_TIMEOUT_SECONDS:-8}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - bot_logs:/app/logs
      - db_backups:/app/backups:ro
    command: ["python", "-m", "app.main"]
    logging: *default-logging

  maintenance:
    image: ${BOT_IMAGE:?Set BOT_IMAGE in Coolify}
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in Coolify}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:?Set TELEGRAM_ADMIN_IDS in Coolify}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in Coolify}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      BITGET_API_URL: ${BITGET_API_URL:-https://api.bitget.com}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-86400}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      HEALTHCHECK_INTERVAL_SECONDS: ${HEALTHCHECK_INTERVAL_SECONDS:-300}
      ADMIN_ALERT_COOLDOWN_SECONDS: ${ADMIN_ALERT_COOLDOWN_SECONDS:-1800}
      ADMIN_NOTIFY_STARTUP_SUCCESS: ${ADMIN_NOTIFY_STARTUP_SUCCESS:-True}
      BITGET_ALERT_FAILURE_THRESHOLD: ${BITGET_ALERT_FAILURE_THRESHOLD:-3}
      BITGET_ALERT_WINDOW_SECONDS: ${BITGET_ALERT_WINDOW_SECONDS:-600}
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-36}
      MAINTENANCE_STALE_HOURS: ${MAINTENANCE_STALE_HOURS:-36}
      SIGNAL_CHART_ENABLED: ${SIGNAL_CHART_ENABLED:-true}
      SIGNAL_CHART_GRANULARITY: ${SIGNAL_CHART_GRANULARITY:-1H}
      SIGNAL_CHART_CANDLE_LIMIT: ${SIGNAL_CHART_CANDLE_LIMIT:-120}
      SIGNAL_CHART_TIMEOUT_SECONDS: ${SIGNAL_CHART_TIMEOUT_SECONDS:-8}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - bot_logs:/app/logs
    command:
      - sh
      - -c
      - |
        while true; do
          date
          python -m app.main --cleanup-retention
          sleep "$${MAINTENANCE_INTERVAL_SECONDS:-86400}"
        done
    logging: *default-logging

  db-backup:
    image: ${BOT_IMAGE:?Set BOT_IMAGE in Coolify}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaiyn_trading_bot}
      POSTGRES_USER: ${POSTGRES_USER:-kaiyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_LOCAL_KEEP_COUNT: ${BACKUP_LOCAL_KEEP_COUNT:-3}
      R2_BACKUP_ENABLED: ${R2_BACKUP_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_PREFIX: ${R2_BACKUP_PREFIX:-kaiyn-trading-bot}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - db_backups:/backups
    command:
      - sh
      - /app/scripts/backup_loop.sh
    logging: *default-logging

volumes:
  postgres_data:
  bot_logs:
  db_backups:
