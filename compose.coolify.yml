x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaiyn_trading_bot}
      POSTGRES_USER: ${POSTGRES_USER:-kaiyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging

  bot:
    image: ${BOT_IMAGE:?Set BOT_IMAGE in Coolify}
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in Coolify}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:?Set TELEGRAM_ADMIN_IDS in Coolify}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in Coolify}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      BITGET_API_URL: ${BITGET_API_URL:-https://api.bitget.com}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-86400}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      HEALTHCHECK_INTERVAL_SECONDS: ${HEALTHCHECK_INTERVAL_SECONDS:-300}
      ADMIN_ALERT_COOLDOWN_SECONDS: ${ADMIN_ALERT_COOLDOWN_SECONDS:-1800}
      ADMIN_NOTIFY_STARTUP_SUCCESS: ${ADMIN_NOTIFY_STARTUP_SUCCESS:-True}
      BITGET_ALERT_FAILURE_THRESHOLD: ${BITGET_ALERT_FAILURE_THRESHOLD:-3}
      BITGET_ALERT_WINDOW_SECONDS: ${BITGET_ALERT_WINDOW_SECONDS:-600}
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-36}
      MAINTENANCE_STALE_HOURS: ${MAINTENANCE_STALE_HOURS:-36}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot_logs:/app/logs
      - db_backups:/app/backups:ro
    command: ["python", "-m", "app.main"]
    logging: *default-logging

  maintenance:
    image: ${BOT_IMAGE:?Set BOT_IMAGE in Coolify}
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in Coolify}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:?Set TELEGRAM_ADMIN_IDS in Coolify}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in Coolify}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      BITGET_API_URL: ${BITGET_API_URL:-https://api.bitget.com}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-86400}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      HEALTHCHECK_INTERVAL_SECONDS: ${HEALTHCHECK_INTERVAL_SECONDS:-300}
      ADMIN_ALERT_COOLDOWN_SECONDS: ${ADMIN_ALERT_COOLDOWN_SECONDS:-1800}
      ADMIN_NOTIFY_STARTUP_SUCCESS: ${ADMIN_NOTIFY_STARTUP_SUCCESS:-True}
      BITGET_ALERT_FAILURE_THRESHOLD: ${BITGET_ALERT_FAILURE_THRESHOLD:-3}
      BITGET_ALERT_WINDOW_SECONDS: ${BITGET_ALERT_WINDOW_SECONDS:-600}
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-36}
      MAINTENANCE_STALE_HOURS: ${MAINTENANCE_STALE_HOURS:-36}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot_logs:/app/logs
    command:
      - sh
      - -c
      - |
        while true; do
          date
          python -m app.main --cleanup-retention
          sleep "$${MAINTENANCE_INTERVAL_SECONDS:-86400}"
        done
    logging: *default-logging

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaiyn_trading_bot}
      POSTGRES_USER: ${POSTGRES_USER:-kaiyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - db_backups:/backups
    command:
      - sh
      - -c
      - |
        mkdir -p /backups
        while true; do
          timestamp=$$(date +%Y%m%d_%H%M%S)
          backup_name="kaiyn_trading_bot_$${timestamp}.sql"
          echo "$$(date) Starting PostgreSQL backup: $${backup_name}.gz"
          if PGPASSWORD="$${POSTGRES_PASSWORD}" pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -f "/backups/$${backup_name}" && gzip -f "/backups/$${backup_name}"; then
            find /backups -type f -name "kaiyn_trading_bot_*.sql.gz" -mtime +"$${RETENTION_DAYS:-30}" -delete
            completed_at=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
            printf '{"status":"success","timestamp":"%s","filename":"%s.gz"}\n' "$${completed_at}" "$${backup_name}" > /backups/backup_status.json
            echo "$$(date) PostgreSQL backup completed: $${backup_name}.gz"
          else
            rm -f "/backups/$${backup_name}" "/backups/$${backup_name}.gz"
            failed_at=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
            printf '{"status":"failed","timestamp":"%s","filename":"%s.gz","error":"pg_dump failed"}\n' "$${failed_at}" "$${backup_name}" > /backups/backup_status.json
            echo "$$(date) PostgreSQL backup failed"
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS:-86400}"
        done
    logging: *default-logging

volumes:
  postgres_data:
  bot_logs:
  db_backups:
